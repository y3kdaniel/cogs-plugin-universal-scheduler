<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Universal Scheduler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181a1f;
      color: #e6e8ec;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 { margin: 0; font-size: 18px; }
    .ver-pill {
      background: #2d3139;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #2d3139; }
    button.secondary:hover { background: #3b404b; }
    button.warn { background: #d97706; color: #fff; }
    button.warn:hover { background: #b45309; }
    button.danger { background: #dc2626; padding: 6px 10px; }
    button.ghost {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #383d4a;
      padding: 5px 10px;
      font-size: 12px;
    }
    button.ghost:hover { color: #fff; border-color: #6b7280; }
    .global-bar {
      background: #22252c;
      border: 1px solid #30343f;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
    }
    .card {
      background: #22252c;
      border: 1px solid #30343f;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card.active-now { border-color: #22c55e; }
    .card.forced { border-color: #f59e0b; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .sub-panel {
      background: #1a1d23;
      border: 1px solid #2d3139;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    label.lbl { font-size: 12px; color: #9ca3af; display: inline-flex; align-items: center; gap: 5px; }
    input[type="text"], input[type="time"], input[type="date"], select {
      background: #14161a;
      color: #fff;
      border: 1px solid #383d4a;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .badge {
      background: #22c55e;
      color: #052e16;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.warn { background: #f59e0b; color: #451a03; }
    .override-group {
      display: inline-flex;
      background: #14161a;
      border: 1px solid #383d4a;
      border-radius: 6px;
      overflow: hidden;
    }
    .override-btn {
      background: transparent;
      color: #9ca3af;
      border-radius: 0;
      padding: 5px 10px;
      font-size: 12px;
    }
    .override-btn.sel-auto { background: #3b82f6; color: #fff; }
    .override-btn.sel-on { background: #f59e0b; color: #000; }
    .override-btn.sel-off { background: #ef4444; color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: #2d3139;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip span { cursor: pointer; color: #f87171; font-weight: bold; }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #2d3139;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .status-bar { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .update-msg { font-size: 12px; color: #9ca3af; }
    .update-msg a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title-row">
        <h2>Show Schedules</h2>
        <span class="ver-pill" id="ver-badge">v3.2.0</span>
        <button class="ghost" style="padding:2px 8px; font-size:11px;" onclick="checkForUpdates()">Check for Updates</button>
        <span class="update-msg" id="update-status"></span>
      </div>
      <div class="status-bar" id="status">Loading schedules...</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <button class="warn" id="reset-overrides-btn" onclick="resetAllOverrides()" style="display:none;">
        Reset All Overrides to Auto
      </button>
      <button class="ghost" onclick="exportSchedules()">Export JSON</button>
      <button class="ghost" onclick="triggerImport()">Import JSON</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none;" onchange="handleImportFile(event)" />
      <button class="secondary" onclick="addSchedule()">+ Add Schedule</button>
      <button onclick="saveAll()">Save Changes</button>
    </div>
  </div>

  <div class="global-bar">
    <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
      <input type="checkbox" id="reset-on-startup" onchange="toggleStartupReset(this.checked)" />
      <span>Automatically reset all Force ON/OFF overrides to <strong>Auto</strong> on startup</span>
    </label>
  </div>

  <div id="list"></div>

  <script>
    const PLUGIN_VERSION = "3.2.0";
    const GITHUB_REPO = "y3kdaniel/cogs-plugin-universal-scheduler";

    const API_STATE = "http://127.0.0";
    const API_SAVE = "http://127.0.0";
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const JS_DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    let settings = { resetOverridesOnStartup: true };
    let schedules = [];
    let activeIds = [];
    let showVariables = {};
    let isDirty = false;
    let openBulkHelper = {};

    async function checkForUpdates() {
      const el = document.getElementById("update-status");
      el.textContent = "Checking...";
      try {
        const res = await fetch(`https://github.com/{GITHUB_REPO}/releases/latest`, {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!res.ok) {
          el.textContent = "No releases published yet.";
          return;
        }
        const data = await res.json();
        const latest = (data.tag_name || "").replace(/^v/i, "");
        if (!latest || latest === PLUGIN_VERSION) {
          el.textContent = "Up to date!";
        } else {
          el.innerHTML = `Update available: <a href="${data.html_url}" target="_blank">v${latest}</a>`;
        }
      } catch (e) {
        el.textContent = "Offline / Local mode";
      }
    }

    async function load(force = false) {
      if (isDirty && !force) return;
      try {
        const res = await fetch(API_STATE);
        const data = await res.json();
        settings = data.settings || { resetOverridesOnStartup: true };
        schedules = data.schedules || [];
        activeIds = data.activeIds || [];
        showVariables = data.showVariables || {};
        isDirty = false;
        document.getElementById("reset-on-startup").checked = !!settings.resetOverridesOnStartup;
        updateStatusBar();
        render();
      } catch (e) {
        document.getElementById("status").textContent = "Connecting to scheduler plugin...";
      }
    }

    function updateStatusBar() {
      const activeNames = schedules
        .filter(s => activeIds.includes(s.id))
        .map(s => s.name || "Unnamed");
      document.getElementById("status").textContent =
        activeNames.length ? `Active right now: ${activeNames.join(", ")}` : "No schedule active right now";

      const hasOverrides = schedules.some(s => s.override && s.override !== "auto");
      document.getElementById("reset-overrides-btn").style.display = hasOverrides ? "inline-block" : "none";
    }

    async function saveAll() {
      await fetch(API_SAVE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ settings, schedules })
      });
      await load(true);
      document.getElementById("status").textContent = "Saved! " + document.getElementById("status").textContent;
    }

    function markDirty() {
      isDirty = true;
      document.getElementById("status").textContent = "Unsaved changes — click Save Changes";
    }

    function exportSchedules() {
      const payload = {
        pluginVersion: PLUGIN_VERSION,
        exportedAt: new Date().toISOString(),
        settings,
        schedules
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const today = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `cogs-schedules-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function triggerImport() {
      const input = document.getElementById("import-file");
      input.value = "";
      input.click();
    }

    function handleImportFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedSchedules = Array.isArray(parsed) ? parsed : parsed.schedules;
          if (!Array.isArray(importedSchedules)) {
            alert("Invalid schedule JSON file: could not find a schedules list.");
            return;
          }
          if (parsed.settings && typeof parsed.settings === "object") {
            settings = { ...settings, ...parsed.settings };
          }
          schedules = importedSchedules;
          await saveAll();
          document.getElementById("status").textContent =
          Imported ${schedules.length} schedule(s) and saved!;
        } catch (err) {
          alert("Failed to parse JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
    }
    function toggleStartupReset(checked) {
      settings.resetOverridesOnStartup = checked;
      saveAll();
    }
    function setOverride(idx, mode) {
      schedules[idx].override = mode;
      saveAll();
    }
    function resetAllOverrides() {
      schedules.forEach(s => { s.override = "auto"; });
      saveAll();
    }
    function addSchedule() {
      schedules.push({
        id: "sched-" + Date.now(),
        name: "New Show",
        enabled: true,
        override: "auto",
        autoRecover: true,
        mode: "dates",
        dates: [],
        daysOfWeek: ["Friday", "Saturday"],
        startTime: "17:00",
        hasEndTime: true,
        endTime: "23:00",
        targetVariable: "",
        activeValue: "",
        restoreOnEnd: true,
        inactiveValue: ""
      });
      markDirty();
      render();
    }
    function duplicateSchedule(idx) {
      const copy = JSON.parse(JSON.stringify(schedules[idx]));
      copy.id = "sched-" + Date.now();
      copy.name = (copy.name || "Schedule") + " (Copy)";
      copy.override = "auto";
      schedules.splice(idx + 1, 0, copy);
      markDirty();
      render();
    }
    function removeSchedule(idx) {
      schedules.splice(idx, 1);
      markDirty();
      render();
    }
    function addDate(idx) {
      const picker = document.getElementById(date-picker-${idx});
      if (!picker.value) return;
      if (!schedules[idx].dates.includes(picker.value)) {
        schedules[idx].dates.push(picker.value);
        schedules[idx].dates.sort();
      }
      picker.value = "";
      markDirty();
      render();
    }
    function addDateRange(idx) {
      const fromVal = document.getElementById(range-from-${idx}).value;
      const toVal = document.getElementById(range-to-${idx}).value;
      if (!fromVal || !toVal) return;
      const allowedDays = new Set();
      DAYS.forEach(day => {
        const cb = document.getElementById(range-day-${idx}-${day});
        if (cb && cb.checked) allowedDays.add(day);
      });
      if (allowedDays.size === 0) return;
      const [fy, fm, fd] = fromVal.split("-").map(Number);
      const [ty, tm, td] = toVal.split("-").map(Number);
      const start = new Date(Date.UTC(fy, fm - 1, fd));
      const end = new Date(Date.UTC(ty, tm - 1, td));
      if (start > end) return;
      const existing = new Set(schedules[idx].dates);
      const cursor = new Date(start);
      let safety = 0;
      while (cursor <= end && safety < 730) {
        const dayName = JS_DAY_NAMES[cursor.getUTCDay()];
        if (allowedDays.has(dayName)) {
          const iso = cursor.toISOString().slice(0, 10);
          existing.add(iso);
        }
        cursor.setUTCDate(cursor.getUTCDate() + 1);
        safety++;
      }
      schedules[idx].dates = Array.from(existing).sort();
      markDirty();
      render();
    }
    function setRangePreset(idx, preset) {
      DAYS.forEach(day => {
        const cb = document.getElementById(range-day-${idx}-${day});
        if (!cb) return;
        if (preset === "all") cb.checked = true;
        if (preset === "fri-sat") cb.checked = (day === "Friday" || day === "Saturday");
        if (preset === "fri-sun") cb.checked = (day === "Friday" || day === "Saturday" || day === "Sunday");
        if (preset === "weekends") cb.checked = (day === "Saturday" || day === "Sunday");
      });
    }
    function clearAllDates(idx) {
      schedules[idx].dates = [];
      markDirty();
      render();
    }
    function removeDate(idx, dateStr) {
      schedules[idx].dates = schedules[idx].dates.filter(d => d !== dateStr);
      markDirty();
      render();
    }
    function toggleDay(idx, day) {
      const arr = schedules[idx].daysOfWeek;
      if (arr.includes(day)) {
        schedules[idx].daysOfWeek = arr.filter(d => d !== day);
      } else {
        arr.push(day);
      }
      markDirty();
      render();
    }
    function renderValueInput(idx, field, varName, currentVal) {
      const varDef = showVariables[varName];
      const safeVal = currentVal === undefined ? "" : String(currentVal);
      if (varDef && varDef.type === "option" && Array.isArray(varDef.options)) {
        const opts = ['-- Select --']
        .concat(varDef.options.map(o => <option value="${o}" ${safeVal === String(o) ? "selected" : ""}>${o}</option>))
        .join("");
        return <select onchange="schedules[${idx}].${field} = this.value; markDirty();">${opts}</select>;
      }
      if (varDef && varDef.type === "boolean") {
        return <select onchange="schedules[${idx}].${field} = this.value; markDirty();"> <option value="">-- Select --</option> <option value="true" ${safeVal === "true" ? "selected" : ""}>True</option> <option value="false" ${safeVal === "false" ? "selected" : ""}>False</option> </select>;
      }
      return <input type="text" style="width:120px;" value="${safeVal}" placeholder="Value" oninput="schedules[${idx}].${field} = this.value; markDirty();" />;
    }
    function render() {
      const container = document.getElementById("list");
      container.innerHTML = "";
      const varNames = Object.keys(showVariables).sort();
      schedules.forEach((s, idx) => {
        const isActive = activeIds.includes(s.id);
        const ov = s.override || "auto";
        const isForced = ov !== "auto";
        const hasEnd = s.hasEndTime !== false;
        const bulkOpen = !!openBulkHelper[s.id];
        const card = document.createElement("div");
        card.className = "card" + (isForced ? " forced" : isActive ? " active-now" : "");
        let dateControls = "";
        if (s.mode === "dates") {
          const chips = s.dates.map(d =>
            <div class="chip">${d} <span onclick="removeDate(${idx}, '${d}')">×</span></div>
          ).join("");
          const dayFilterPills = DAYS.map(day =>
            <label class="day-pill"><input type="checkbox" id="range-day-${idx}-${day}" checked /> ${day.slice(0,3)}</label>
          ).join("");
          const bulkPanel = bulkOpen ? `
            
            From
            to
            Add Matching Dates
            
            Include:
            ${dayFilterPills}
            All
            Fri–Sat
            Fri–Sun
            
            
          ` : "";
          dateControls = <div class="row" style="margin-bottom:6px;"> <input type="date" id="date-picker-${idx}" /> <button class="secondary" onclick="addDate(${idx})">+ Add Date</button> <button class="ghost" onclick="openBulkHelper['${s.id}'] = !openBulkHelper['${s.id}']; render();"> ${bulkOpen ? "Hide Date Range Helper" : "Bulk Add Date Range..."} </button> ${s.dates.length > 0 ?Clear All (${s.dates.length}): ""} </div> ${bulkPanel} <div class="chips">${chips || "<span style='color:#6b7280;font-size:12px;'>No dates selected yet</span>"}</div>;
        } else if (s.mode === "days") {
          const pills = DAYS.map(day => {
            const checked = s.daysOfWeek.includes(day) ? "checked" : "";
            return <label class="day-pill"><input type="checkbox" ${checked} onchange="toggleDay(${idx}, '${day}')"/> ${day.slice(0,3)}</label>;
          }).join("");
          dateControls = <div class="row">${pills}</div>;
        }
        const varOptions = ['(None — use events/states only)']
          .concat(varNames.map(v => <option value="${v}" ${s.targetVariable === v ? "selected" : ""}>${v}</option>))
          .join("");
        const endVarControls = (hasEnd && s.targetVariable) ? `
          When Ended →
          ${s.restoreOnEnd !== false ? renderValueInput(idx, "inactiveValue", s.targetVariable, s.inactiveValue) : ""}
          ` : "";
        const varInputs = s.targetVariable ? `
          When Active →
          ${renderValueInput(idx, "activeValue", s.targetVariable, s.activeValue)}
          ${endVarControls}
          ` : "";
          card.innerHTML = <div class="row" style="justify-content:space-between;"> <div class="row" style="margin:0;"> <input type="checkbox" ${s.enabled ? "checked" : ""} onchange="schedules[${idx}].enabled = this.checked; markDirty();" /> <input type="text" value="${s.name}" placeholder="Schedule Name" oninput="schedules[${idx}].name = this.value; markDirty();" /> ${isActive ? '<span class="badge">Active Now</span>' : ""} ${isForced ?${ov === "force_on" ? "Forced ON" : "Forced OFF"}` : ""}

            
            
            <button class="override-btn ${ov === "auto" ? "sel-auto" : ""}" onclick="setOverride(${idx}, 'auto')">Auto
            <button class="override-btn ${ov === "force_on" ? "sel-on" : ""}" onclick="setOverride(${idx}, 'force_on')">Force ON
            <button class="override-btn ${ov === "force_off" ? "sel-off" : ""}" onclick="setOverride(${idx}, 'force_off')">Force OFF
            
            Duplicate
            Delete
            
            Runs:
            <option value="dates" ${s.mode === "dates" ? "selected" : ""}>Specific Calendar Dates
            <option value="days" ${s.mode === "days" ? "selected" : ""}>Days of the Week
            <option value="daily" ${s.mode === "daily" ? "selected" : ""}>Every Day
            ${hasEnd ? "From" : "At"}
            End Time:
            ${hasEnd ? <input type="time" value="${s.endTime}" onchange="schedules[${idx}].endTime = this.value; markDirty();" /> : ""}
            Auto-recover after power loss
            ${dateControls}
            Set Show Variable:
            ${varOptions}
            
            ${varInputs}
            
            
            `;
          container.appendChild(card);
        });
      }
load();
setInterval(() => load(false), 5000);
